plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yourname.gemini'
    compileSdk 34

    defaultConfig {
        applicationId 'com.yourname.gemini'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    def signingEnv = ['GEMINI_KEYSTORE_PATH', 'GEMINI_KEYSTORE_PASSWORD',
                      'GEMINI_KEY_ALIAS', 'GEMINI_KEY_PASSWORD']
    def hasReleaseSigning = signingEnv.every { System.getenv(it) }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(System.getenv('GEMINI_KEYSTORE_PATH'))
                storePassword System.getenv('GEMINI_KEYSTORE_PASSWORD')
                keyAlias System.getenv('GEMINI_KEY_ALIAS')
                keyPassword System.getenv('GEMINI_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Two product flavors = two tags, two installable APKs, one source tree:
    //   gemini  -> "Gemini WebView" tag. Uses src/main only; behaviour and
    //              file layout are exactly what that tag has always shipped.
    //   chatgpt -> "Chatgpt WebView" tag. Everything ChatGPT-specific lives in
    //              src/chatgpt (own launcher activity, own URL policy, own
    //              resource overrides). No file under src/main changes.
    // ChatGPT is also a separate applicationId so it installs next to the
    // Gemini app instead of replacing it.
    flavorDimensions = ['assistant']
    productFlavors {
        gemini {
            dimension 'assistant'
        }
        chatgpt {
            dimension 'assistant'
            applicationId 'com.yourname.chatgpt'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // androidx.core:core-ktx:1.8.0 (pulled in by appcompat) and core-splashscreen:1.0.1
    // still ask for kotlin-stdlib-jdk7/jdk8 1.6.21, while androidx.activity:activity:1.8.2
    // pulls kotlin-stdlib 1.8.22. Since Kotlin 1.8.0 those jdk7/jdk8 classes live inside
    // kotlin-stdlib itself, so mixing the old jars makes :app:checkDebugDuplicateClasses
    // fail with "Duplicate class kotlin.collections.jdk8.CollectionsJDK8Kt" (CI run
    // 36586215991). The Kotlin BOM aligns every org.jetbrains.kotlin module on one
    // version, and the 1.8.22 jdk7/jdk8 artifacts are empty shells, so the duplicate
    // classes disappear.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')

    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity:1.8.2'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    testImplementation 'junit:junit:4.13.2'
}
