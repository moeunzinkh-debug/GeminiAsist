name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      # The ubuntu runner image already ships the Android SDK (ANDROID_HOME is set
      # and the licences are pre-accepted), so the job installs the packages it
      # needs with that SDK's own sdkmanager.
      #
      # Do NOT reintroduce android-actions/setup-android@v3 here: its `packages`
      # default is `tools platform-tools`, and the legacy `tools` package was
      # removed from Google's SDK repository. sdkmanager then exits 1
      # ("Failed to find package 'tools'") and the job dies before Gradle ever
      # runs. (Run 36585480375 failed exactly there.)
      - name: Install Android SDK 34
        run: |
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "ANDROID_HOME is not set on this runner." >&2
            exit 1
          fi

          # sdkmanager is normally on PATH; fall back to the SDK directory in case
          # the runner image changes how it is exposed.
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at '$SDKMANAGER'." >&2
            exit 1
          fi
          echo "Using $SDKMANAGER"

          # Idempotent: just writes the licence hashes into $ANDROID_HOME/licenses.
          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
      # All four secrets are optional. Without them the release APK is UNSIGNED.
      - name: Prepare optional release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.GEMINI_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GEMINI_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GEMINI_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GEMINI_KEY_PASSWORD }}
        run: |
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/gemini-release.jks"
            echo "GEMINI_KEYSTORE_PATH=$RUNNER_TEMP/gemini-release.jks" >> "$GITHUB_ENV"
            echo "GEMINI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "GEMINI_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "GEMINI_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          fi
      - name: Test and lint
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug
      - name: Build debug and release APKs
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleRelease
      # A phone only installs an APK whose signature it can read, so print exactly
      # what each file is signed with. The report also lands in the run summary
      # and inside the artifact, so it can be checked without the log.
      - name: Report APK signing
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/34.0.0/apksigner"
          REPORT=apk-signing-report.txt
          : > "$REPORT"
          {
            echo "## APK signing report"
            echo ""
            echo "keystore: \`$(ls -l "$HOME/.android/debug.keystore" 2>/dev/null || echo 'none (fresh key generated for this run)')\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          for apk in app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk; do
            [ -f "$apk" ] || continue
            name="$(basename "$apk")"
            if "$APKSIGNER" verify --print-certs "$apk" > /tmp/certs.txt 2>&1; then
              echo "- ✅ \`$name\` — signed, the phone will install it" | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ⛔ \`$name\` — UNSIGNED: Android refuses to install this file" | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            fi
            cat /tmp/certs.txt >> "$REPORT"
            sed 's/^/    /' /tmp/certs.txt
          done

          # The debug key is the one that decides whether a new build can upgrade
          # an already installed app (Android requires the same key).
          if [ -f "$HOME/.android/debug.keystore" ]; then
            {
              echo ""
              echo "debug keystore fingerprint:"
              keytool -list -v -keystore "$HOME/.android/debug.keystore" \
                -storepass android -alias androiddebugkey 2>/dev/null \
                | grep -iE "SHA256:|Valid from:" || true
            } | tee -a "$REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
      # Same bytes, honest file names: the release APK keeps an UNSIGNED marker so
      # nobody tries to sideload it by mistake.
      - name: Name the APKs after what they are
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/gemini-debug-installable.apk
          if [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp app/build/outputs/apk/release/app-release-unsigned.apk dist/gemini-release-UNSIGNED-needs-signing.apk
          elif [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/gemini-release-signed-installable.apk
          fi
          cp apk-signing-report.txt dist/
          ls -lh dist
      - name: Upload debug APK (signed, installable)
        uses: actions/upload-artifact@v7
        with:
          name: gemini-debug-apk
          path: dist/gemini-debug-*.apk
          if-no-files-found: error
      - name: Upload release APK (unsigned unless signing secrets are set)
        uses: actions/upload-artifact@v7
        with:
          name: gemini-release-apk
          path: |
            dist/gemini-release-*.apk
            dist/apk-signing-report.txt
          if-no-files-found: error
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/gemini-release.jks"
