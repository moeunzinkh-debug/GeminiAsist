<?xml version="1.0" encoding="UTF-8"?>
<!--
  GeminiAssist launcher icon source (original artwork, drawn for this project).

  This is NOT Google's Gemini logo. It is a generic rounded chat bubble with a
  four-point sparkle inside, on a deep indigo tile.

  How to use it in Android Studio:
    1. File > New > Image Asset
    2. Icon Type: Launcher Icons (Adaptive and Legacy)
    3. Foreground Layer > Source Asset > Image > pick this SVG
       (Scaling: "Fit", Shape: "None", Trim: "No")
    4. Background Layer > Color > #14182B  (or Image > this SVG's background rect)
    5. Legacy tab > "Generate legacy icon" ON, Shape "Square"/"Circle"
    6. Finish - Android Studio then writes mipmap-*/ic_launcher.png and
       mipmap-anydpi-v26/ic_launcher.xml.

  The checked-in vector drawables (res/drawable/ic_launcher_background.xml,
  ic_launcher_foreground.xml, ic_launcher_monochrome.xml) and the PNG fallbacks
  (mipmap-*/ic_launcher*.png, generated by tools/make-launcher-icons.sh) are the
  same geometry as this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Background tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="#14182B"/>
  <path d="M0,512 L512,0 L512,512 Z" fill="#1E2547"/>
  <path d="M0,512 L512,256 L512,512 Z" fill="#262E58"/>

  <!-- Chat bubble outline with tail -->
  <g fill="none" stroke="#FFFFFF" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
    <rect x="121" y="133" width="270" height="201" rx="59" ry="59"/>
    <polyline points="246,334 190,394 190,334"/>
  </g>

  <!-- Four-point sparkle -->
  <path fill="#8AB4F8"
        d="M256,171 Q264.2,233.2 327,242 Q264.2,250.8 256,313 Q247.8,250.8 185,242 Q247.8,233.2 256,171 Z"/>
</svg>
